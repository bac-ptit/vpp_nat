unix {
  nodaemon
  log /tmp/vpp-node2.log
  full-coredump
  cli-listen /run/vpp/cli-node2.sock
  gid vpp
  poll-sleep-usec 500
}

api-trace { on }
api-segment { prefix node2 gid vpp }
socksvr { socket-name /run/vpp/api-node2.sock }
statseg { socket-name /run/vpp/stats-node2.sock }

cpu {
  main-core 8
  corelist-workers 9,10,11,12,13,14,15
}

memory {
  main-heap-size 4000M
}

buffers {
  buffers-per-numa 64000
}

plugins {
  plugin nat_pba_plugin.so { enable }
}
