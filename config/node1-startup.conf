unix {
  nodaemon
  log /tmp/vpp-node1.log
  full-coredump
  cli-listen /run/vpp/cli-node1.sock
  gid vpp
  poll-sleep-usec 500
}

api-trace { on }
api-segment { prefix node1 gid vpp }
socksvr { socket-name /run/vpp/api-node1.sock }
statseg { socket-name /run/vpp/stats-node1.sock }

cpu {
  main-core 0
  corelist-workers 1,2,3,4,5,6,7
}

memory {
  main-heap-size 4000M
}

buffers {
  buffers-per-numa 64000
}

plugins {
  plugin nat_pba_plugin.so { enable }
}
